version: 2
project_name: bitbucket-custom-mcp

before:
  hooks:
    # Checks the tag against the committed version, then gathers the license notices of Go and
    # of the modules linked into the builds below, for the release notes.
    - >-
      go run github.com/edspc/go-release-actions/cmd/release@14f3e2c0b2fa2023d2ac52a8d72cd760cf53c96c
      notices -out .scratch/THIRD_PARTY_LICENSES -main ./cmd/server
      -platforms darwin/arm64,darwin/amd64,linux/arm64,linux/amd64
      -version "{{ .Version }}" -file cmd/server/cli.go -snapshot={{ .IsSnapshot }}
      -combined .scratch/release-licenses.txt

builds:
  - main: ./cmd/server
    binary: bitbucket-custom-mcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath, -mod=readonly]
    # The committed version also works for builds from the source archive.
    ldflags: [-s, -w]

archives:
  - name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
    formats: [binary]

source:
  enabled: false

checksum:
  disable: true

snapshot:
  version_template: '{{ .Version }}-SNAPSHOT'

changelog:
  use: git

release:
  github:
    owner: edspc
    name: bitbucket-custom-mcp
  name_template: '{{ .Tag }}'
  footer: |
    <details>
    <summary>License notices</summary>

    ~~~~text
    {{ mustReadFile ".scratch/release-licenses.txt" }}
    ~~~~

    </details>
