version: 2
project_name: bitbucket-custom-mcp

before:
  hooks:
    - 'bash scripts/prepare-release-assets.sh "{{ .Version }}" "{{ .IsSnapshot }}"'

builds:
  - main: ./cmd/server
    binary: bitbucket-custom-mcp
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath, -mod=readonly]
    # The committed version also works for builds from the source archive.
    ldflags: [-s, -w]

archives:
  - name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - src: .scratch/THIRD_PARTY_LICENSES/**/*
        dst: THIRD_PARTY_LICENSES

source:
  enabled: true
  format: tar.gz
  name_template: '{{ .ProjectName }}-{{ .Version }}-source'
  prefix_template: '{{ .ProjectName }}-{{ .Version }}/'

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ .Version }}-SNAPSHOT'

changelog:
  use: git

release:
  github:
    owner: edspc
    name: bitbucket-custom-mcp
  name_template: '{{ .Tag }}'
