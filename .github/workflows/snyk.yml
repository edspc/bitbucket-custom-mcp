name: Snyk

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the Snyk CLI
        run: npm install --global snyk@1.1308.0
      - name: Scan dependencies and code
        run: make snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
