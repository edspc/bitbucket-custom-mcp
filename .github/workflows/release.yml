name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to increase; the parts after it reset to 0'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Raise version
        id: version
        uses: edspc/go-release-actions/bump@14f3e2c0b2fa2023d2ac52a8d72cd760cf53c96c
        with:
          part: ${{ inputs.bump }}
          file: cmd/server/cli.go
          replace: docs/cli.md
      - name: Check version is new
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo 'The release tag already exists.' >&2
            exit 1
          fi
          mkdir -p .scratch
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > .scratch/release-tags
          if grep -Fx "v$RELEASE_VERSION" .scratch/release-tags; then
            echo 'The release already exists.' >&2
            exit 1
          fi
          echo "Releasing v$RELEASE_VERSION ($RELEASE_BUMP)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: make test
      - name: Commit version and tag locally
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/server/cli.go docs/cli.md
          git commit -m "Release v$RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
      - name: Push version commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$RELEASE_VERSION"
      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
