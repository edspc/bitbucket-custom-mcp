name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the Snyk CLI
        run: npm install --global snyk@1.1308.0
      - name: Scan dependencies and code
        run: make snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # The scans of make osv, run by the official OSV-Scanner action.
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the server
        id: build
        run: make build
      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: |-
            --recursive
            --no-call-analysis=go
            ./
      - name: Scan the built server
        # Runs even when the dependency scan failed, so both report.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          # The file, not its directory: the action passes a scan that finds nothing to scan,
          # while a missing file fails it.
          scan-args: |-
            --experimental-plugins=go/binary
            bin/bitbucket-custom-mcp
